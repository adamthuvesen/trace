# Golden queries for tests/fixtures/eval_kb — a small but adversarial corpus for
# CI/local smoke eval. The fixture is deliberately discriminating: it packs
# confusable concept clusters (TF-IDF vs BM25, cosine vs dot-product, the eval
# metrics, RRF vs linear combination, chunk overlap vs size vs splitting) so that
# a single doc is the "right" answer but several are plausible distractors.
#
# Queries fall into three buckets:
#   - lexical / exact-term  -> BM25 should win (and smart should take the fast path)
#   - paraphrase / vocab-mismatch -> the answer doc shares few surface words, so
#     pure keyword search struggles and vector retrieval earns its keep
#   - ambiguous -> a distractor competes hard, so ranking (MRR) suffers
#
# Run the same harness as production eval without copying golden_queries.example.yaml:
#
#   KB_PATH=tests/fixtures/eval_kb \
#   EVAL_GOLDEN_QUERIES=tests/fixtures/eval_golden_queries.yaml \
#   uv run python -m tools.eval.cli --full --search smart
#
# Add --include-stress to include the paraphrase stress queries at the bottom.
version: '1.0'
description: Adversarial fixture golden set (17 core + 2 stress); lexical + paraphrase mix
queries:
# --- Conceptual baseline -----------------------------------------------------
- id: easy-bm25
  query: What is BM25?
  category: concepts
  expected_path: glossary/bm25.md
  expected_keywords:
  - BM25
  - keyword
  - ranking
  quick_set: true
- id: easy-embeddings
  query: What are embeddings?
  category: concepts
  expected_path: glossary/embeddings.md
  expected_keywords:
  - embeddings
  - vectors
  - meaning
  quick_set: false
# --- Lexical / exact-term: BM25 wins, smart should take the fast path ---------
- id: lex-embedding-backend
  query: EMBEDDING_BACKEND onnx torch
  category: config
  expected_path: config/embedding-backend.md
  expected_keywords:
  - EMBEDDING_BACKEND
  - onnx
  - torch
  quick_set: true
- id: lex-index-path
  query: INDEX_PATH
  category: config
  expected_path: config/index-path.md
  expected_keywords:
  - INDEX_PATH
  - index
  quick_set: true
- id: lex-reranker-flag
  query: RERANKER_ENABLED flag
  category: config
  expected_path: config/reranker.md
  expected_keywords:
  - RERANKER_ENABLED
  - cross-encoder
  quick_set: false
- id: lex-mutually-exclusive
  query: mutually exclusive KB_COLLECTIONS error
  category: troubleshooting
  expected_path: troubleshooting/conflicting-roots.md
  expected_keywords:
  - mutually exclusive
  - KB_COLLECTIONS
  quick_set: true
- id: lex-saturation
  query: term frequency saturation document length normalization
  category: concepts
  expected_path: glossary/bm25.md
  expected_keywords:
  - term frequency
  - normalization
  quick_set: false
# --- Paraphrase / vocabulary mismatch: vector retrieval should win ------------
- id: para-overlap
  query: keep sentences from being cut off where two chunks meet
  category: indexing
  expected_path: indexing/chunk-overlap.md
  expected_keywords:
  - overlap
  - chunk
  quick_set: true
- id: para-rerank
  query: reorder the shortlist with a slower but more accurate model
  category: features
  expected_path: features/reranking.md
  expected_keywords:
  - reranking
  - relevance
  quick_set: false
- id: para-rrf
  query: blend two ranked result lists without any training
  category: search
  expected_path: glossary/rrf.md
  expected_keywords:
  - rank
  - fusion
  quick_set: true
- id: para-cosine
  query: gauge how aligned two vectors are regardless of their length
  category: concepts
  expected_path: glossary/cosine-similarity.md
  expected_keywords:
  - cosine
  - angle
  quick_set: false
- id: para-ann
  query: find nearby vectors fast without scanning every one
  category: concepts
  expected_path: glossary/ann-search.md
  expected_keywords:
  - nearest neighbor
  - vector
  quick_set: false
- id: para-mrr
  query: metric that only cares how high the first correct answer lands
  category: metrics
  expected_path: glossary/mrr.md
  expected_keywords:
  - reciprocal
  - rank
  quick_set: false
- id: para-crossenc
  query: model that scores a query and document jointly in one pass
  category: features
  expected_path: features/cross-encoder.md
  expected_keywords:
  - cross-encoder
  - relevance
  quick_set: false
- id: para-idf
  query: down-weight words that appear in almost every document
  category: concepts
  expected_path: glossary/tf-idf.md
  expected_keywords:
  - inverse document frequency
  - rare
  quick_set: false
# --- Ambiguous: a distractor competes hard, so ranking suffers ----------------
- id: amb-hybrid
  query: combine keyword and semantic signals into one ranking
  category: search
  expected_path: search/hybrid-search.md
  expected_keywords:
  - hybrid
  - semantic
  quick_set: true
- id: amb-ndcg
  query: reward putting better answers higher using graded relevance
  category: metrics
  expected_path: glossary/ndcg.md
  expected_keywords:
  - relevance
  - rank
  quick_set: false
# --- Stress subset (harder paraphrases; run with --stress / --include-stress) -
- id: stress-bm25
  query: >-
    Which bag-of-words scoring model dampens term frequency and normalizes by
    document length?
  category: concepts
  expected_path: glossary/bm25.md
  expected_keywords:
  - BM25
  - keyword
  - ranking
  quick_set: false
  difficulty: hard
  stress_set: true
  max_rank: 2
- id: stress-hybrid
  query: >-
    I need both lexical overlap and semantic similarity in one result list—what
    pattern should I read about first?
  category: concepts
  expected_path: search/hybrid-search.md
  expected_keywords:
  - hybrid search
  - semantic
  - keyword
  quick_set: false
  difficulty: hard
  stress_set: true
  max_rank: 3
- id: stress-rrf-not-linear
  query: >-
    I do not want score normalization or hand tuned weights; which method
    combines retriever rankings by position instead?
  category: contrast
  expected_path: glossary/rrf.md
  expected_keywords:
  - RRF
  - rank
  - fusion
  quick_set: false
  difficulty: hard
  stress_set: true
  max_rank: 5
- id: stress-linear-not-rrf
  query: >-
    I do not want reciprocal-rank fusion; which method adds weighted normalized
    retriever scores?
  category: contrast
  expected_path: search/linear-combination.md
  expected_keywords:
  - linear combination
  - normalized
  - weights
  quick_set: false
  difficulty: hard
  stress_set: true
  max_rank: 2
- id: stress-dot-not-cosine
  query: >-
    I am not asking for cosine angle; which vector operation sums element-wise
    products and is affected by magnitude?
  category: contrast
  expected_path: glossary/dot-product.md
  expected_keywords:
  - dot product
  - magnitude
  - vectors
  quick_set: false
  difficulty: hard
  stress_set: true
- id: stress-cosine-not-dot
  query: >-
    I am not asking for dot product magnitude effects; which measure compares
    vector direction by angle?
  category: contrast
  expected_path: glossary/cosine-similarity.md
  expected_keywords:
  - cosine
  - angle
  - direction
  quick_set: false
  difficulty: hard
  stress_set: true
  max_rank: 2
- id: stress-recall-not-precision
  query: >-
    Which metric asks how many relevant items we found, not just how clean the
    returned list is?
  category: contrast
  expected_path: glossary/precision-recall.md
  expected_keywords:
  - recall
  - relevant
  quick_set: false
  difficulty: hard
  stress_set: true
- id: stress-crossencoder-not-reranking
  query: >-
    Which model architecture reads query and document together, rather than the
    general act of reordering results?
  category: contrast
  expected_path: features/cross-encoder.md
  expected_keywords:
  - cross-encoder
  - query
  - document
  quick_set: false
  difficulty: hard
  stress_set: true
  max_rank: 2
- id: stress-chunk-size-not-overlap
  query: >-
    Which indexing knob changes passage length, not repeated boundary context?
  category: contrast
  expected_path: indexing/chunk-size.md
  expected_keywords:
  - chunk size
  - passages
  - relevance
  quick_set: false
  difficulty: hard
  stress_set: true
- id: stress-overlap-not-size
  query: >-
    Which indexing knob repeats boundary text, not passage length?
  category: contrast
  expected_path: indexing/chunk-overlap.md
  expected_keywords:
  - overlap
  - boundaries
  - context
  quick_set: false
  difficulty: hard
  stress_set: true
  max_rank: 2
- id: stress-kb-path-not-index-path
  query: >-
    Which env var points at the source document tree, not where index files are
    stored?
  category: contrast
  expected_path: config/kb-path.md
  expected_keywords:
  - KB_PATH
  - knowledge base
  - path
  quick_set: false
  difficulty: hard
  stress_set: true
  max_rank: 2
- id: stress-index-path-not-kb-path
  query: >-
    Which env var stores index files outside the source tree, not the
    knowledge-base root?
  category: contrast
  expected_path: config/index-path.md
  expected_keywords:
  - INDEX_PATH
  - indexes
  - root
  quick_set: false
  difficulty: hard
  stress_set: true
