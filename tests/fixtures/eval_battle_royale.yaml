version: "1.0"
description: Multi-KB retrieval battle suite for deterministic local evaluation.
modes:
  - bm25
  - semantic
  - hybrid
  - reranked
  - smart
knowledge_bases:
  - id: retrieval
    name: Retrieval concepts fixture
    kb_path: eval_kb
    golden_queries: eval_golden_queries.yaml
    include_stress: true
  - id: support
    name: Support and operations fixture
    kb_path: battle_kbs/support_kb
    golden_queries: battle_kbs/support_golden_queries.yaml
  - id: api
    name: API integration fixture
    kb_path: battle_kbs/api_kb
    golden_queries: battle_kbs/api_golden_queries.yaml
