[project]
name = "trace"
version = "0.3.0"
description = "Local document search for file-backed knowledge bases"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp==4.1.6",
    "fastembed>=0.3.0",
    "bm25s>=0.2.0",
    "PyStemmer>=2.2.0",
    "pydantic-settings>=2.0.0",
    "pathspec>=0.12.1",      # .traceignore (gitignore semantics)
    "PyYAML>=6.0.0",         # Markdown frontmatter
    # Document format extractors
    "pymupdf>=1.24.0",       # PDF text extraction
    "python-docx>=1.0.0",    # Word document extraction
    "python-pptx>=0.6.0",    # PowerPoint extraction
    "numpy>=1.26.0,<2.5",
    "pydantic>=2.0.0",
]

[project.scripts]
trace = "trace_search.server.trace_server:main"

[project.optional-dependencies]
convert = [
    "markitdown[pdf,docx,pptx]",  # Document conversion
    "pandas>=2.0.0",              # CSV/XLSX handling
    "tabulate>=0.9.0",            # DataFrame.to_markdown()
    "openpyxl>=3.1.0",            # Excel support
    "rich>=13.0.0",               # Progress bars
    "click>=8.0.0",               # CLI
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "click>=8.0.0",
    "PyYAML>=6.0.0",
    "ruff==0.17.4",
    "basedpyright==1.40.2",
    "types-pyyaml>=6.0.12.20260906",
    "import-linter>=2.15",
    "pandas-stubs>=3.1.0.261029",
    "pytest-xdist>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
strict_markers = true
markers = [
    "slow: needs model preparation; runs in `just integration`",
    "transport: starts real stdio or HTTP server processes; runs in `just integration`",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PGH003", "PTH", "RUF"]
# The formatter owns line length; E501 only flags text it cannot wrap.
ignore = ["E501"]

[tool.basedpyright]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
pythonVersion = "3.14"
include = ["src/trace_search", "tools", "tests", ".agents/skills/verify-trace"]
exclude = ["**/__pycache__"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["src", "."]
reportMissingParameterType = false
reportPrivateUsage = false

[tool.importlinter]
root_package = "trace_search"

[[tool.importlinter.contracts]]
name = "Runtime code does not depend on server adapters"
type = "forbidden"
source_modules = ["trace_search.collections", "trace_search.retrieval", "trace_search.indexing", "trace_search.extraction"]
forbidden_modules = ["trace_search.server"]

[[tool.importlinter.contracts]]
name = "Index construction does not depend on retrieval or collection operations"
type = "forbidden"
source_modules = ["trace_search.indexing", "trace_search.extraction"]
forbidden_modules = ["trace_search.retrieval", "trace_search.collections"]
