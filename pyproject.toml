[project]
name = "trace"
version = "0.3.0"
description = "Local document search for file-backed knowledge bases"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp==4.1.6",
    "fastembed>=0.3.0",
    "bm25s>=0.2.0",
    "PyStemmer>=2.2.0",
    "pydantic-settings>=2.0.0",
    "pathspec>=0.12.1",      # .traceignore (gitignore semantics)
    "PyYAML>=6.0.0",         # Markdown frontmatter
    "numpy>=1.26.0,<2.5",
    "pydantic>=2.0.0",
]

[project.scripts]
trace = "trace_search.server.trace_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "click>=8.0.0",
    "PyYAML>=6.0.0",
    "ruff==0.17.4",
    "basedpyright==1.40.2",
    "types-pyyaml>=6.0.12.20260906",
    "import-linter>=2.15",
    "pytest-xdist>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
strict_markers = true
markers = [
    "slow: needs model preparation; runs in `just integration`",
    "transport: starts real stdio or HTTP server processes; runs in `just integration`",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PGH003", "PGH004", "PTH", "RUF", "TID251"]
# The formatter owns line length; E501 only flags text it cannot wrap.
ignore = ["E501"]

