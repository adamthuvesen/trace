[tool.ruff.lint.per-file-ignores]
"tools/verify_package.py" = ["TID251"]
"tools/eval/provenance.py" = ["TID251"]
"tests/test_runtime_boundaries.py" = ["TID251"]
"tests/test_runtime_hardening.py" = ["TID251"]
"tests/test_strict_mode.py" = ["TID251"]
"tests/test_transports.py" = ["TID251"]
".agents/skills/verify-trace/drives.py" = ["TID251"]
".agents/skills/verify-trace/verify" = ["TID251"]

[tool.basedpyright]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
pythonVersion = "3.14"
include = ["src/trace_search", "tools", "tests"]
exclude = ["**/__pycache__"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["src", "."]
reportMissingParameterType = false
reportPrivateUsage = false

[tool.importlinter]
root_package = "trace_search"

[[tool.importlinter.contracts]]
name = "Runtime code does not depend on server adapters"
type = "forbidden"
source_modules = ["trace_search.collections", "trace_search.retrieval", "trace_search.indexing", "trace_search.extraction"]
forbidden_modules = ["trace_search.server"]

[[tool.importlinter.contracts]]
name = "Index construction does not depend on retrieval or collection operations"
type = "forbidden"
source_modules = ["trace_search.indexing", "trace_search.extraction"]
forbidden_modules = ["trace_search.retrieval", "trace_search.collections"]
