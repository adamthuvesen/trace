[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]
"tools/verify_package.py" = ["TID251"]
"tools/eval/provenance.py" = ["TID251"]
".agents/skills/verify-trace/drives.py" = ["TID251"]
".agents/skills/verify-trace/verify" = ["TID251"]

[tool.basedpyright]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
reportIgnoreCommentWithoutRule = "error"
pythonVersion = "3.14"
include = ["src/trace_search", "tools", "tests"]
exclude = ["**/__pycache__"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["src", "."]
reportMissingParameterType = false
reportPrivateUsage = false

[tool.importlinter]
root_package = "trace_search"

[[tool.importlinter.contracts]]
name = "Runtime code (collections, retrieval, indexing, extraction) must not import server; server calls runtime, not back"
type = "forbidden"
source_modules = ["trace_search.collections", "trace_search.retrieval", "trace_search.indexing", "trace_search.extraction"]
forbidden_modules = ["trace_search.server"]

[[tool.importlinter.contracts]]
name = "Indexing and extraction must not import retrieval or collections; move shared code down into indexing"
type = "forbidden"
source_modules = ["trace_search.indexing", "trace_search.extraction"]
forbidden_modules = ["trace_search.retrieval", "trace_search.collections"]

[[tool.importlinter.contracts]]
name = "Extraction must not import indexing; indexing calls extraction, so move shared code into extraction"
type = "forbidden"
source_modules = ["trace_search.extraction"]
forbidden_modules = ["trace_search.indexing"]

[[tool.importlinter.contracts]]
name = "Server must not import runtime internals; add a TraceOperations method in collections/operations.py"
type = "forbidden"
source_modules = ["trace_search.server"]
allow_indirect_imports = true
forbidden_modules = [
    "trace_search.collections.collection_registry",
    "trace_search.collections.document_listing",
    "trace_search.collections.index_stats",
    "trace_search.extraction",
    "trace_search.indexing",
    "trace_search.retrieval",
    "trace_search.filesystem_paths",
]
