name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Checks (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"
      - run: just bootstrap
      - run: just check

  integration:
    name: Model, package, and retrieval verification
    needs: check
    runs-on: ubuntu-latest
    env:
      TRACE_MODEL_CACHE: ${{ github.workspace }}/.trace-model-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.5"
          python-version: "3.14"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"
      - run: just bootstrap
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.TRACE_MODEL_CACHE }}
          key: trace-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
      - run: just integration
      - run: .agents/skills/verify-trace/verify all
      - run: .agents/skills/verify-trace/verify control
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: retrieval-verification
          path: tools/eval/results/runs/
