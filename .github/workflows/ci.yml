name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Checks (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      - run: just bootstrap
      - run: just check

  integration:
    name: Model, package, and retrieval verification
    runs-on: ubuntu-latest
    env:
      TRACE_MODEL_CACHE: ${{ github.workspace }}/.trace-model-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      - run: just bootstrap
      - uses: actions/cache@v4
        with:
          path: ${{ env.TRACE_MODEL_CACHE }}
          key: trace-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
      - run: just integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-verification
          path: tools/eval/results/runs/
